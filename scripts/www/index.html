                        bestThisDepth = null; bestScore = color === 'black' ? Infinity : -Infinity;
                        alpha = -Infinity; beta = Infinity; equalMoves = [];
                        for (const move of ordered) {
                            const p = b[move.fromRow][move.fromCol], t = b[move.toRow][move.toCol];
                            b[move.toRow][move.toCol] = p; b[move.fromRow][move.fromCol] = null;
                            const newHash = baseHash ^ ZOBRIST[p][move.fromRow][move.fromCol] ^ ZOBRIST[p][move.toRow][move.toCol] ^ (t ? ZOBRIST[t][move.toRow][move.toCol] : 0);
                            const score = minimax(b, depth - 1, alpha, beta, color === 'black', color, newHash, 1);
                            b[move.fromRow][move.fromCol] = p; b[move.toRow][move.toCol] = t;
                            if (searchAborted) break;
                            if (color === 'black') {
                                if (score < bestScore) { bestScore = score; bestThisDepth = move; equalMoves = [move]; }
                                else if (score === bestScore) equalMoves.push(move);
                                beta = Math.min(beta, score);
                            } else {
                                if (score > bestScore) { bestScore = score; bestThisDepth = move; equalMoves = [move]; }
                                else if (score === bestScore) equalMoves.push(move);
                                alpha = Math.max(alpha, score);
                            }
                        }
                    }
                    if (searchAborted) break;
                    if (equalMoves.length > 1 && Math.random() < 0.5) bestThisDepth = equalMoves[Math.floor(Math.random() * equalMoves.length)];
                    if (bestThisDepth) {
                        bestMove = bestThisDepth;
                        prevScore = bestScore;
                        const idx = ordered.indexOf(bestThisDepth);
                        if (idx > 0) { ordered.splice(idx, 1); ordered.unshift(bestThisDepth); }
                    }
                    if (performance.now() - start > timeLimitMs * 0.7) break;
                    if (Math.abs(bestScore) > MATE_SCORE - 200) break;
                }
                return bestMove;
            } catch (e) {
                console.error('findBestMove error:', e);
                return null;
            }
        }

        // ============================================================
        // 绘制
        // ============================================================
        let boardGridCanvas = null;
        function prerenderGrid() {
            boardGridCanvas = document.createElement('canvas');
            boardGridCanvas.width = BOARD_WIDTH;
            boardGridCanvas.height = BOARD_HEIGHT;
            const g = boardGridCanvas.getContext('2d', { alpha: false });
            g.fillStyle = '#f2e6d0'; g.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
            g.lineWidth = 2; g.strokeStyle = '#5a3e1b';
            for (let r = 0; r < 10; r++) {
                const y = MARGIN_Y + r * CELL_SIZE;
                g.beginPath(); g.moveTo(MARGIN_X, y); g.lineTo(MARGIN_X + 8 * CELL_SIZE, y); g.stroke();
            }
            for (let c = 0; c < 9; c++) {
                const x = MARGIN_X + c * CELL_SIZE;
                g.beginPath();
                if (c === 0 || c === 8) { g.moveTo(x, MARGIN_Y); g.lineTo(x, MARGIN_Y + 9 * CELL_SIZE); }
                else {
                    g.moveTo(x, MARGIN_Y); g.lineTo(x, MARGIN_Y + 4 * CELL_SIZE);
                    g.moveTo(x, MARGIN_Y + 5 * CELL_SIZE); g.lineTo(x, MARGIN_Y + 9 * CELL_SIZE);
                }
                g.stroke();
            }
            g.beginPath();
            g.moveTo(MARGIN_X + 3 * CELL_SIZE, MARGIN_Y + 7 * CELL_SIZE);
            g.lineTo(MARGIN_X + 5 * CELL_SIZE, MARGIN_Y + 9 * CELL_SIZE);
            g.moveTo(MARGIN_X + 5 * CELL_SIZE, MARGIN_Y + 7 * CELL_SIZE);
            g.lineTo(MARGIN_X + 3 * CELL_SIZE, MARGIN_Y + 9 * CELL_SIZE);
            g.moveTo(MARGIN_X + 3 * CELL_SIZE, MARGIN_Y);
            g.lineTo(MARGIN_X + 5 * CELL_SIZE, MARGIN_Y + 2 * CELL_SIZE);
            g.moveTo(MARGIN_X + 5 * CELL_SIZE, MARGIN_Y);
            g.lineTo(MARGIN_X + 3 * CELL_SIZE, MARGIN_Y + 2 * CELL_SIZE);
            g.stroke();
            g.font = 'bold 24px "KaiTi", "楷体", serif';
            g.fillStyle = '#5a3e1b';
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText('楚 河', MARGIN_X + 2 * CELL_SIZE, MARGIN_Y + 4.5 * CELL_SIZE);
            g.fillText('汉 界', MARGIN_X + 6 * CELL_SIZE, MARGIN_Y + 4.5 * CELL_SIZE);
        }

        function drawBoard() {
            if (!gameState.running) return;
            if (!boardGridCanvas) prerenderGrid();
            ctx.drawImage(boardGridCanvas, 0, 0);

            if (gameState.lastMove) {
                const { fromRow, fromCol, toRow, toCol } = gameState.lastMove;
                ctx.beginPath();
                ctx.arc(MARGIN_X + fromCol * CELL_SIZE, MARGIN_Y + fromRow * CELL_SIZE, PIECE_RADIUS + 4, 0, Math.PI * 2);
                ctx.strokeStyle = '#8fbc8f'; ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
                ctx.beginPath();
                ctx.arc(MARGIN_X + toCol * CELL_SIZE, MARGIN_Y + toRow * CELL_SIZE, PIECE_RADIUS + 4, 0, Math.PI * 2);
                ctx.strokeStyle = '#8fbc8f'; ctx.lineWidth = 3; ctx.stroke();
            }

            if (gameState.legalTargets.length > 0) {
                for (const t of gameState.legalTargets) {
                    ctx.beginPath();
                    ctx.arc(MARGIN_X + t.col * CELL_SIZE, MARGIN_Y + t.row * CELL_SIZE, 8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(80, 160, 80, 0.45)'; ctx.fill();
                }
            }

            const anim = gameState.animState;
            const animActive = anim && (performance.now() - anim.startTime < anim.duration + 50);

            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 9; c++) {
                    const piece = gameState.board[r][c];
                    if (!piece) continue;
                    if (animActive && r === anim.fromRow && c === anim.fromCol) continue;
                    drawPiece(ctx, piece, r, c);
                }
            }

            if (animActive) {
                const t = Math.min(1, (performance.now() - anim.startTime) / anim.duration);
                const easeT = 1 - Math.pow(1 - t, 3);
                const x = MARGIN_X + (anim.fromCol + (anim.toCol - anim.fromCol) * easeT) * CELL_SIZE;
                const y = MARGIN_Y + (anim.fromRow + (anim.toRow - anim.fromRow) * easeT) * CELL_SIZE;
                drawPieceAt(ctx, anim.piece, x, y);
            }

            const redKing = findKing(gameState.board, 'red');
            const blackKing = findKing(gameState.board, 'black');
            const redThreat = isDoubleCannonMateThreat(gameState.board, 'red');
            const blackThreat = isDoubleCannonMateThreat(gameState.board, 'black');

            if (redThreat && redKing) highlightKing(redKing, '#ff3333');
            if (blackThreat && blackKing) highlightKing(blackKing, '#ff3333');
            if (!redThreat && !blackThreat) {
                if (isKingInCheck(gameState.board, 'red') && redKing) highlightKing(redKing, '#ff9900');
                if (isKingInCheck(gameState.board, 'black') && blackKing) highlightKing(blackKing, '#ff9900');
            }

            if (gameState.selectedPiece) {
                const { row, col } = gameState.selectedPiece;
                ctx.beginPath();
                ctx.arc(MARGIN_X + col * CELL_SIZE, MARGIN_Y + row * CELL_SIZE, PIECE_RADIUS + 5, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 4; ctx.stroke();
            }
        }

        function highlightKing(pos, color) {
            const x = MARGIN_X + pos.col * CELL_SIZE;
            const y = MARGIN_Y + pos.row * CELL_SIZE;
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 200);
            ctx.beginPath();
            ctx.arc(x, y, PIECE_RADIUS + 6 + pulse * 3, 0, Math.PI * 2);
            ctx.strokeStyle = color; ctx.lineWidth = 3;
            ctx.globalAlpha = 0.5 + pulse * 0.5; ctx.stroke(); ctx.globalAlpha = 1;
        }

        function drawPiece(g, piece, row, col) {
            drawPieceAt(g, piece, MARGIN_X + col * CELL_SIZE, MARGIN_Y + row * CELL_SIZE);
        }

        function drawPieceAt(g, piece, x, y) {
            const isRed = piece === piece.toUpperCase();
            g.beginPath(); g.arc(x, y, PIECE_RADIUS, 0, Math.PI * 2);
            g.fillStyle = isRed ? '#f5e6d3' : '#e0d5c0'; g.fill();
            g.strokeStyle = '#5a3e1b'; g.lineWidth = 2.5; g.stroke();
            g.beginPath(); g.arc(x, y, PIECE_RADIUS - 4, 0, Math.PI * 2);
            g.strokeStyle = isRed ? '#b33e2c' : '#2a2a2a'; g.lineWidth = 2; g.stroke();
            const charMap = { 'K': '帅', 'A': '仕', 'B': '相', 'N': '马', 'R': '车', 'C': '炮', 'P': '兵', 'k': '将', 'a': '士', 'b': '象', 'n': '马', 'r': '车', 'c': '炮', 'p': '卒' };
            g.font = 'bold 30px "KaiTi", "楷体", "Microsoft YaHei", serif';
            g.fillStyle = isRed ? '#b33e2c' : '#1e1e1e';
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText(charMap[piece] || piece, x, y + 2);
        }

        function startAnimationLoop() {
            if (animationRafId) return;
            needAnimationLoop = true;
            const loop = () => {
                if (!needAnimationLoop) { animationRafId = null; return; }
                drawBoard();
                animationRafId = requestAnimationFrame(loop);
            };
            animationRafId = requestAnimationFrame(loop);
        }

        function stopAnimationLoop() { needAnimationLoop = false; }

        // Bug1：animId 隔离，旧 setTimeout 不清掉新动画
        function animateMove(fromRow, fromCol, toRow, toCol, piece, callback) {
            const myId = ++animCounter;
            gameState.animState = { piece, fromRow, fromCol, toRow, toCol, startTime: performance.now(), duration: 180, animId: myId };
            startAnimationLoop();
            setTimeout(() => {
                try {
                    // 仅当 animState 还是自己时才清空
                    if (gameState.animState && gameState.animState.animId === myId) {
                        gameState.animState = null;
                    }
                    drawBoard();
                    if (callback) callback();
                } catch (e) {
                    console.error('animateMove error:', e);
                    if (gameState.animState && gameState.animState.animId === myId) {
                        gameState.animState = null;
                    }
                }
            }, 210);
        }

        // ============================================================
        // 界面更新
        // ============================================================
        function updateTurnDisplay() {
            if (gameState.gameOver) {
                if (gameState.winner === 'draw') {
                    turnIndicator.textContent = '和棋' + (gameState.drawReason ? ` (${gameState.drawReason})` : '');
                    turnIndicator.classList.add('draw');
                    turnIndicator.classList.remove('check', 'thinking');
                } else if (gameState.winner === 'red') {
                    turnIndicator.textContent = '红方获胜！';
                    turnIndicator.classList.remove('check', 'thinking', 'draw');
                } else if (gameState.winner === 'black') {
                    turnIndicator.textContent = '黑方获胜！';
                    turnIndicator.classList.remove('check', 'thinking', 'draw');
                }
            } else if (gameState.aiBusy) {
                let who = 'AI思考中...';
                if (gameState.mode === 'autolearn') who = '🧠 自主学习对局中...';
                else if (gameState.difficulty === 'hell') who = 'AI 地狱思考中...';
                turnIndicator.textContent = who;
                turnIndicator.classList.add('thinking');
                turnIndicator.classList.remove('check', 'draw');
            } else {
                const inCheck = isKingInCheck(gameState.board, gameState.currentPlayer);
                const doubleCannon = isDoubleCannonMateThreat(gameState.board, gameState.currentPlayer);
                if (doubleCannon) {
                    turnIndicator.textContent = (gameState.currentPlayer === 'red' ? '红方' : '黑方') + '危险！重炮！';
                    turnIndicator.classList.add('check');
                    turnIndicator.classList.remove('thinking', 'draw');
                } else if (inCheck) {
                    turnIndicator.textContent = (gameState.currentPlayer === 'red' ? '红方' : '黑方') + '被将军！';
                    turnIndicator.classList.add('check');
                    turnIndicator.classList.remove('thinking', 'draw');
                } else {
                    turnIndicator.textContent = gameState.currentPlayer === 'red' ? '红方走棋' : '黑方走棋';
                    turnIndicator.classList.remove('check', 'thinking', 'draw');
                }
            }
            updateUndoBtn();
        }

        function updateUndoBtn() {
            if (!gameState.running) { undoBtn.disabled = true; return; }
            if (gameState.mode === 'autolearn') { undoBtn.style.display = 'none'; return; }
            undoBtn.style.display = '';
            if (gameState.aiBusy || gameState.animState || gameState.gameOver) { undoBtn.disabled = true; return; }
            undoBtn.disabled = gameState.mode === 'ai' ? gameState.moveHistory.length < 2 : gameState.moveHistory.length < 1;
        }

        // ============================================================
        // 统一 AI 调度器
        // ============================================================
        function scheduleAIMove(delay) {
            if (!gameState.running || gameState.gameOver || gameState.aiBusy) return;
            if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
            aiTimer = setTimeout(() => {
                aiTimer = null;
                if (!gameState.running || gameState.gameOver || gameState.aiBusy) return;
                executeAIMove();
            }, delay || 50);
        }

        function executeAIMove() {
            if (!gameState.running || gameState.gameOver || gameState.aiBusy) return;

            if (gameState.animState) {
                scheduleAIMove(50);
                return;
            }

            gameState.aiBusy = true;
            updateTurnDisplay();

            setTimeout(() => {
                try {
                    let move = null;
                    const color = gameState.currentPlayer;
                    const mode = gameState.mode;
                    const diff = gameState.difficulty;

                    if (mode === 'autolearn') {
                        const timeLimit = 1500;
                        const maxDepth = 10;
                        move = findBestMove(gameState.board, color, maxDepth, timeLimit);
                        if (!move) {
                            const legal = getAllLegalMoves(gameState.board, color);
                            if (legal.length > 0) move = legal[Math.floor(Math.random() * legal.length)];
                        }
                        if (!gameState.gameOver) {
                            gameState.autolearnMoveCount++;
                            const elapsed = ((performance.now() - gameState.autolearnStartTime) / 1000).toFixed(1);
                            autolearnInfo.textContent = `🧠 自主学习 | 第 ${gameState.autolearnMoveCount} 步 | 已用 ${elapsed}s | 权重 v${learningData.weightVersion}`;
                            autolearnInfo.classList.add('show');
                        }
                    } else if (mode === 'ai') {
                        if (diff === 'easy') {
                            const moves = getAllLegalMoves(gameState.board, 'black');
                            if (moves.length > 0) {
                                if (Math.random() < 0.3) move = moves[Math.floor(Math.random() * moves.length)];
                                else {
                                    const captures = moves.filter(m => gameState.board[m.toRow][m.toCol] != null);
                                    if (captures.length > 0 && Math.random() < 0.6) move = captures[Math.floor(Math.random() * captures.length)];
                                    else move = moves[Math.floor(Math.random() * moves.length)];
                                }
                            }
                        } else if (diff === 'medium') {
                            if (Math.random() < 0.1) {
                                const moves = getAllLegalMoves(gameState.board, 'black');
                                if (moves.length > 0) move = moves[Math.floor(Math.random() * moves.length)];
                            } else {
                                move = findBestMove(gameState.board, 'black', 5, 700);
                            }
                            if (!move) { const m = getAllLegalMoves(gameState.board, 'black'); if (m.length > 0) move = m[0]; }
                        } else if (diff === 'hard') {
                            move = findBestMove(gameState.board, 'black', 7, 2000);
                            if (!move) { const m = getAllLegalMoves(gameState.board, 'black'); if (m.length > 0) move = m[0]; }
                        } else if (diff === 'master') {
                            move = findBestMove(gameState.board, 'black', 9, 3500);
                            if (!move) { const m = getAllLegalMoves(gameState.board, 'black'); if (m.length > 0) move = m[0]; }
                        } else {
                            if (canOpponentFormDoubleCannonInOne(gameState.board, 'black')) {
                                for (const m of getAllLegalMoves(gameState.board, 'black')) {
                                    const p = gameState.board[m.fromRow][m.fromCol];
                                    if (!p || p.toUpperCase() !== 'C') continue;
                                    const t = gameState.board[m.toRow][m.toCol];
                                    gameState.board[m.toRow][m.toCol] = p; gameState.board[m.fromRow][m.fromCol] = null;
                                    const stillThreatened = isDoubleCannonMateThreat(gameState.board, 'black');
                                    gameState.board[m.fromRow][m.fromCol] = p; gameState.board[m.toRow][m.toCol] = t;
                                    if (!stillThreatened) { move = m; break; }
                                }
                            }
                            if (!move) move = findBestMove(gameState.board, 'black', 16, 12000);
                            if (!move) { const m = getAllLegalMoves(gameState.board, 'black'); if (m.length > 0) move = m[0]; }
                        }
                    }

                    if (move) {
                        makeMove(move.fromRow, move.fromCol, move.toRow, move.toCol);
                    } else {
                        const isCheckmated = isCheckmate(gameState.board, color);
                        if (isCheckmated) {
                            endGame(color === 'red' ? 'black' : 'red', '将死');
                        } else {
                            endGame(color === 'red' ? 'black' : 'red', '困毙');
                        }
                    }
                } catch (e) {
                    console.error('executeAIMove error:', e);
                } finally {
                    gameState.aiBusy = false;
                    updateTurnDisplay();
                    if (!gameState.animState) drawBoard();

                    if (!gameState.gameOver && gameState.running) {
                        const needAI = (gameState.mode === 'autolearn') ||
                                       (gameState.mode === 'ai' && gameState.currentPlayer === 'black');
                        if (needAI && !aiTimer) {
                            setTimeout(() => scheduleAIMove(50), 0);
                        }
                    }
                }
            }, 30);
        }

        // ============================================================
        // 统一结束游戏
        // ============================================================
        function endGame(result, reason) {
            if (gameState.gameOver) return;
            gameState.gameOver = true;
            gameState.winner = result;
            gameState.drawReason = result === 'draw' ? reason : null;
            if (result === 'draw') playSound('draw'); else playSound('win');
            updateTurnDisplay();
            drawBoard();

            let msg;
            if (result === 'draw') msg = `和棋！${reason || ''}`;
            else if (result === 'red') msg = '红方获胜！';
            else msg = '黑方获胜！';
            toast(msg, 2000);

            if (result === 'draw') {
                recordGameResult('draw', reason);
            } else {
                recordGameResult(result);
                const lastMoves = gameState.moveHistory.slice(-6);
                for (const m of lastMoves) recordMoveOutcome(m.preHash, m, m.piece === result);
                saveLearningData();
                updateLearningDisplay();
            }
            autolearnInfo.classList.remove('show');
            if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
        }

        // ============================================================
        // 走棋（epoch 隔离：防止旧 finishMove 误作用于新棋局）
        // ============================================================
        function makeMove(fromRow, fromCol, toRow, toCol) {
            if (gameState.gameOver) return false;
            const movingPiece = gameState.board[fromRow][fromCol];
            if (!movingPiece) return false;
            if (getPieceColor(movingPiece) !== gameState.currentPlayer) return false;
            if (!isValidMove(gameState.board, fromRow, fromCol, toRow, toCol, gameState.currentPlayer)) return false;

            const forceSkipAnimation = gameState.mode === 'autolearn';
            if (forceSkipAnimation) gameState.animState = null;

            // Bug1：记录当前棋局代数
            const myEpoch = gameState.epoch;

            const preMoveHash = computeZobrist(gameState.board, gameState.currentPlayer);
            const targetPiece = gameState.board[toRow][toCol];
            gameState.board[toRow][toCol] = movingPiece;
            gameState.board[fromRow][fromCol] = null;

            if (isKingInCheck(gameState.board, gameState.currentPlayer)) {
                gameState.board[fromRow][fromCol] = movingPiece;
                gameState.board[toRow][toCol] = targetPiece;
                toast('不能送将！');
                drawBoard();
                return false;
            }

            if (targetPiece) playSound('capture'); else playSound('move');
            const pieceColor = getPieceColor(movingPiece);
            const pieceType = movingPiece.toUpperCase();
            gameState.moveHistory.push({
                fromRow, fromCol, toRow, toCol,
                piece: pieceColor, pieceType, captured: targetPiece, preHash: preMoveHash
            });
            const newPosHash = computeZobrist(gameState.board, gameState.currentPlayer === 'red' ? 'black' : 'red');
            gameState.positionHistory.push(newPosHash);
            gameState.selectedPiece = null;
            gameState.legalTargets = [];
            gameState.lastMove = { fromRow, fromCol, toRow, toCol };

            if (targetPiece) gameState.noCaptureCount = 0;
            else gameState.noCaptureCount++;
            if (!gameState.positionCounts[newPosHash]) gameState.positionCounts[newPosHash] = 0;
            gameState.positionCounts[newPosHash]++;

            const previousPlayer = gameState.currentPlayer;
            const opponentColor = previousPlayer === 'red' ? 'black' : 'red';
            const oppKing = findKing(gameState.board, opponentColor);

            if (!oppKing) {
                // 兜底：对方将帅已被吃（正常流程不应到达）
                gameState.currentPlayer = opponentColor;
                endGame(previousPlayer, '将死');
                return true;
            }

            gameState.currentPlayer = opponentColor;

            // 结束判定统一在动画后执行，避免同步阻塞主线程
            const finishMove = () => {
                if (gameState.gameOver) return;
                // Bug1：棋局已重置，退出
                if (gameState.epoch !== myEpoch) return;

                // 1. 将死
                if (isCheckmate(gameState.board, gameState.currentPlayer)) {
                    endGame(previousPlayer, '将死');
                    return;
                }

                // 2. 双炮杀（含 canEscape 检测）
                if (isDoubleCannonMateThreat(gameState.board, gameState.currentPlayer)) {
                    const moves = getAllLegalMoves(gameState.board, gameState.currentPlayer);
                    let canEscape = false;
                    for (const move of moves) {
                        const p = gameState.board[move.fromRow][move.fromCol];
                        const t = gameState.board[move.toRow][move.toCol];
                        gameState.board[move.toRow][move.toCol] = p;
                        gameState.board[move.fromRow][move.fromCol] = null;
                        if (!isDoubleCannonMateThreat(gameState.board, gameState.currentPlayer)) canEscape = true;
                        gameState.board[move.fromRow][move.fromCol] = p;
                        gameState.board[move.toRow][move.toCol] = t;
                        if (canEscape) break;
                    }
                    if (!canEscape) {
                        endGame(previousPlayer, '双炮杀');
                        return;
                    }
                }

                // 3. 困毙（未被将军但无合法走法）
                if (!isKingInCheck(gameState.board, gameState.currentPlayer)) {
                    const legalMoves = getAllLegalMoves(gameState.board, gameState.currentPlayer);
                    if (legalMoves.length === 0) {
                        endGame(previousPlayer, '困毙');
                        return;
                    }
                }

                // 4. 和棋
                const drawResult = isDraw(gameState.board, gameState.currentPlayer);
                if (drawResult.isDraw) {
                    endGame('draw', drawResult.reason);
                    return;
                }

                // 5. 正常流程
                if (isKingInCheck(gameState.board, gameState.currentPlayer)) playSound('check');
                updateTurnDisplay();
                drawBoard();

                if (gameState.mode === 'ai' && gameState.currentPlayer === 'black') {
                    setTimeout(() => scheduleAIMove(50), 0);
                } else if (gameState.mode === 'autolearn') {
                    setTimeout(() => scheduleAIMove(50), 0);
                }
            };

            if (!forceSkipAnimation) {
                animateMove(fromRow, fromCol, toRow, toCol, movingPiece, finishMove);
            } else {
                finishMove();
            }
            return true;
        }

        // ============================================================
        // 初始化 / 控制（epoch++ 使旧的异步回调失效）
        // ============================================================
        function initGame(mode, difficulty) {
            clearAllTimers();
            gameState.epoch++;  // Bug1：新棋局，旧 finishMove 失效
            gameState.mode = mode;
            gameState.difficulty = difficulty;
            gameState.board = createInitialBoard();
            gameState.currentPlayer = 'red';
            gameState.selectedPiece = null;
            gameState.legalTargets = [];
            gameState.gameOver = false;
            gameState.winner = null;
            gameState.drawReason = null;
            gameState.lastMove = null;
            gameState.moveHistory = [];
            gameState.positionHistory = [];
            gameState.positionCounts = {};
            gameState.noCaptureCount = 0;
            gameState.running = true;
            gameState.aiBusy = false;
            gameState.animState = null;
            gameState.autolearnMoveCount = 0;
            gameState.autolearnStartTime = performance.now();
            TT.clear();
            clearHeuristics();
            autolearnInfo.classList.remove('show');

            const initHash = computeZobrist(gameState.board, 'red');
            gameState.positionHistory.push(initHash);
            gameState.positionCounts[initHash] = 1;

            modeBadge.textContent = mode === 'ai' ? '单人模式' : (mode === 'human' ? '双人对战' : '自主学习');
            modeBadge.style.background = mode === 'ai' ? '#5a7d5a' : (mode === 'human' ? '#5a5a7d' : '#3a5a7d');
            learningBadge.style.display = mode === 'autolearn' ? 'inline-block' : 'none';
            turnIndicator.classList.toggle('autolearn-mode', mode === 'autolearn');
            hellBadge.style.display = difficulty === 'hell' ? 'inline-block' : 'none';
            turnIndicator.classList.toggle('hell-mode', difficulty === 'hell');

            updateLearningDisplay();
            updateTurnDisplay();
            drawBoard();

            if (mode === 'autolearn') {
                autolearnInfo.textContent = `🧠 自主学习 | 权重 v${learningData.weightVersion} | 准备开始...`;
                autolearnInfo.classList.add('show');
                scheduleAIMove(200);
            }
        }

        backBtn.addEventListener('click', () => {
            if (gameState.aiBusy) return;
            clearAllTimers();
            gameContainer.classList.remove('active');
            startScreen.classList.remove('hidden');
            gameState.running = false;
            gameState.gameOver = true;
            gameState.animState = null;
            gameState.epoch++;  // Bug1：使正在执行的 finishMove 失效
            autolearnInfo.classList.remove('show');
            updateLearningDisplay();
        });

        resetBtn.addEventListener('click', () => {
            if (!gameState.running) return;
            if (gameState.aiBusy) return;
            // Bug1：epoch 机制保证旧 finishMove 失效，无需额外 animState 拦截
            initGame(gameState.mode, gameState.difficulty);
        });

        undoBtn.addEventListener('click', () => {
            if (!gameState.running || gameState.aiBusy || gameState.animState) return;
            if (gameState.mode === 'ai') {
                if (gameState.moveHistory.length < 2) return;
                undoMove(); undoMove();
            } else {
                if (gameState.moveHistory.length < 1) return;
                undoMove();
            }
            gameState.gameOver = false;
            gameState.winner = null;
            gameState.drawReason = null;
            gameState.selectedPiece = null;
            gameState.legalTargets = [];

            gameState.positionCounts = {};
            for (const h of gameState.positionHistory) {
                if (!gameState.positionCounts[h]) gameState.positionCounts[h] = 0;
                gameState.positionCounts[h]++;
            }

            gameState.noCaptureCount = 0;
            for (let i = gameState.moveHistory.length - 1; i >= 0; i--) {
                if (gameState.moveHistory[i].captured) break;
                gameState.noCaptureCount++;
            }

            updateTurnDisplay();
            drawBoard();
        });

        function undoMove() {
            const last = gameState.moveHistory.pop();
            if (!last) return;
            const movedPiece = gameState.board[last.toRow][last.toCol];
            gameState.board[last.fromRow][last.fromCol] = movedPiece;
            gameState.board[last.toRow][last.toCol] = last.captured || null;
            gameState.currentPlayer = last.piece;
            gameState.positionHistory.pop();
            if (gameState.positionHistory.length === 0) {
                const initHash = computeZobrist(gameState.board, 'red');
                gameState.positionHistory.push(initHash);
            }
            if (gameState.moveHistory.length > 0) {
                const prev = gameState.moveHistory[gameState.moveHistory.length - 1];
                gameState.lastMove = { fromRow: prev.fromRow, fromCol: prev.fromCol, toRow: prev.toRow, toCol: prev.toCol };
            } else {
                gameState.lastMove = null;
            }
        }

        // ============================================================
        // 画布交互
        // ============================================================
        function handlePointerDown(e) {
            if (!gameState.running || gameState.mode === 'autolearn') return;
            if (gameState.gameOver || gameState.aiBusy || gameState.animState) return;
            if (gameState.mode === 'ai' && gameState.currentPlayer === 'black') return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            const col = Math.round((mouseX - MARGIN_X) / CELL_SIZE);
            const row = Math.round((mouseY - MARGIN_Y) / CELL_SIZE);
            if (row < 0 || row > 9 || col < 0 || col > 8) return;

            if (gameState.selectedPiece) {
                const { row: fr, col: fc } = gameState.selectedPiece;
                if (fr === row && fc === col) {
                    gameState.selectedPiece = null;
                    gameState.legalTargets = [];
                    drawBoard();
                    return;
                }
                const success = makeMove(fr, fc, row, col);
                if (success) return;
                const piece = gameState.board[row][col];
                if (piece && getPieceColor(piece) === gameState.currentPlayer) selectPiece(row, col);
                else { gameState.selectedPiece = null; gameState.legalTargets = []; }
                drawBoard();
            } else {
                const piece = gameState.board[row][col];
                if (piece && getPieceColor(piece) === gameState.currentPlayer) {
                    selectPiece(row, col);
                    drawBoard();
                }
            }
        }

        function selectPiece(row, col) {
            gameState.selectedPiece = { row, col };
            gameState.legalTargets = [];
            for (let tr = 0; tr < 10; tr++) {
                for (let tc = 0; tc < 9; tc++) {
                    if (!isValidMove(gameState.board, row, col, tr, tc, gameState.currentPlayer)) continue;
                    const p = gameState.board[row][col], t = gameState.board[tr][tc];
                    gameState.board[tr][tc] = p; gameState.board[row][col] = null;
                    const check = isKingInCheck(gameState.board, gameState.currentPlayer);
                    gameState.board[row][col] = p; gameState.board[tr][tc] = t;
                    if (!check) gameState.legalTargets.push({ row: tr, col: tc });
                }
            }
        }

        // ============================================================
        // 开始界面
        // ============================================================
        let selectedMode = 'ai';
        let selectedDifficulty = 'medium';

        loadLearningData();
        updateLearningDisplay();

        document.getElementById('exportLearningBtn').addEventListener('click', () => {
            try {
                let jsonStr;
                try {
                    jsonStr = JSON.stringify(learningData, null, 2);
                } catch (err) {
                    alert('导出失败: 学习数据无法序列化\n' + err.message);
                    return;
                }
                if (!jsonStr || jsonStr.length === 0) {
                    alert('导出失败: 学习数据为空');
                    return;
                }
                const filename = `chess_learning_${Date.now()}.json`;
                let downloadStarted = false;

                try {
                    if (typeof Blob !== 'undefined' && typeof URL !== 'undefined' && URL.createObjectURL) {
                        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        a.style.display = 'none';
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 1000);
                        downloadStarted = true;
                    }
                } catch (e) { console.warn('方案1 (Blob) 失败:', e); }

                if (!downloadStarted) {
                    try {
                        const dataUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonStr);
                        const a = document.createElement('a');
                        a.href = dataUrl;
                        a.download = filename;
                        a.style.display = 'none';
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => document.body.removeChild(a), 1000);
                        downloadStarted = true;
                    } catch (e) { console.warn('方案2 (dataURL) 失败:', e); }
                }

                if (!downloadStarted) {
                    const w = window.open('', '_blank');
                    if (w) {
                        w.document.write('<pre style="white-space:pre-wrap;word-break:break-all;">' +
                            jsonStr.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>');
                        w.document.title = filename;
                    } else {
                        alert('导出失败: 浏览器不支持下载且弹窗被拦截\n请手动复制以下 JSON:\n\n' + jsonStr.slice(0, 500) + '...');
                    }
                }

                if (downloadStarted) {
                    setTimeout(() => alert('学习数据已导出: ' + filename), 200);
                }
            } catch (err) {
                console.error('导出异常:', err);
                alert('导出失败: ' + err.message);
            }
        });

        document.getElementById('importLearningBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data && typeof data === 'object') {
                            learningData = Object.assign(learningData, data);
                            saveLearningData();
                            updateLearningDisplay();
                            alert('学习数据已导入');
                        }
                    } catch (err) { alert('导入失败: 文件格式错误'); }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        document.getElementById('clearLearningBtn').addEventListener('click', () => {
            if (confirm('确定清除所有学习数据吗？')) {
                learningData = {
                    moveBook: {}, weightVersion: 1,
                    weights: { cannonValue: 380, kingSafety: 1.0, synergy: 1.0, threat: 1.0, mobility: 1.0, pieceSafety: 1.0, centerControl: 1.0 },
                    gamesPlayed: 0, wins: 0, losses: 0, draws: 0, openingBook: {}
                };
                saveLearningData();
                updateLearningDisplay();
            }
        });

        document.querySelectorAll('.mode-option').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.mode-option').forEach(o => o.classList.remove('active'));
                el.classList.add('active');
                selectedMode = el.dataset.mode;
                const hideDiff = selectedMode === 'human' || selectedMode === 'autolearn';
                document.getElementById('difficultyLabel').style.display = hideDiff ? 'none' : 'block';
                document.getElementById('difficultyOptions').style.display = hideDiff ? 'none' : 'flex';
            });
        });

        document.querySelectorAll('.diff-option').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.diff-option').forEach(o => o.classList.remove('active'));
                el.classList.add('active');
                selectedDifficulty = el.dataset.diff;
            });
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            initAudio();
            startScreen.classList.add('hidden');
            gameContainer.classList.add('active');
            setTimeout(() => {
                initGame(selectedMode, selectedMode === 'autolearn' ? 'hell' : selectedDifficulty);
            }, 400);
        });

        canvas.addEventListener('pointerdown', handlePointerDown);
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('resize', () => {
            if (gameState.running) drawBoard();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (gameState.running) drawBoard();
            }, 200);
        });
    })();
</script>
</body>
</html>
